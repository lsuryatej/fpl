[project]
name = "fplopt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pulp>=3.3.2",
    "pyarrow>=25.0.1",
    "python-dateutil>=2.9.0.post0",
    "requests>=2.34.2",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplopt"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
